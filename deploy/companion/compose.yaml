name: carter-companion
services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: carter-companion:local
    restart: unless-stopped
    init: true
    command: ['node', 'packages/web/bin/cli.js', 'serve', '--foreground', '--host', '0.0.0.0', '--port', '3000']
    stop_grace_period: 45s
    environment:
      OPENCHAMBER_UI_PASSWORD: ${OPENCHAMBER_UI_PASSWORD:?Set a unique UI password in the private environment file}
      OPENCHAMBER_HOST: 0.0.0.0
      OPENCHAMBER_PORT: '3000'
      OPENCHAMBER_RELAY_HOST: 'off'
      TZ: ${TZ:-America/New_York}
    volumes:
      - app-config:/home/openchamber/.config
      - app-data:/home/openchamber/.local
      - workspaces:/home/openchamber/workspaces
    expose:
      - '3000'
    mem_limit: 3g
    cpus: 1.5
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  edge:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      CARTER_HOSTNAME: ${CARTER_HOSTNAME:?Set the DNS hostname pointing to this server}
      ACME_EMAIL: ${ACME_EMAIL:?Set an email for certificate renewal notices}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  app-config:
  app-data:
  workspaces:
  certificates:
  caddy-config:
